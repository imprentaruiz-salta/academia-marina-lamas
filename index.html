<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Academia de canto Marina Lamas</title>
  <meta name="description" content="Academia de canto Marina Lamas.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Academia de canto Marina Lamas">
  <meta property="og:description" content="Academia de canto Marina Lamas.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="icon-192.png">
  <meta name="theme-color" content="#fbf8f5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Marina Lamas">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
  <main class="page">
    <div class="ornament" aria-hidden="true"><span></span><span></span><span></span></div>
    <section class="identity" aria-labelledby="title">
      <img class="logo" src="logo.jpg" alt="Logo de Academia de Canto Marina Lamas">
      <p class="eyebrow">ACADEMIA DE CANTO</p>
      <h1 id="title">Marina Lamas</h1>
      <div class="rule" aria-hidden="true"><span></span><span>♪</span><span></span></div>
      <p class="welcome">Clases de Canto</p>
      <p class="offer">Técnica Vocal</p>
    </section>
  </main>
  <style>
    :root{color-scheme:light;--wine:#9e1830;--ink:#332b2b;--paper:#fbf8f5;--gold:#b9a26b}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:Georgia,'Times New Roman',serif}
    .page{min-height:100vh;display:grid;place-items:center;padding:32px 20px;position:relative;overflow:hidden}
    .page:before,.page:after{content:"";position:absolute;width:min(70vw,520px);height:min(70vw,520px);border:1px solid rgba(158,24,48,.10);border-radius:50%;pointer-events:none}
    .page:before{top:-38%;left:-25%}.page:after{bottom:-43%;right:-25%;width:min(80vw,620px);height:min(80vw,620px)}
    .identity{position:relative;z-index:1;width:min(100%,680px);text-align:center;padding:32px 22px 38px}
    .logo{display:block;width:min(100%,500px);height:auto;margin:0 auto 24px;border-radius:2px}
    .eyebrow{margin:0 0 10px;color:var(--wine);font-family:Arial,sans-serif;font-size:clamp(.72rem,2.3vw,.95rem);letter-spacing:.38em}
    h1{margin:0;color:#332b2b;font-size:clamp(2.2rem,8vw,4.5rem);font-weight:400;letter-spacing:.12em}
    .rule{display:flex;align-items:center;justify-content:center;gap:14px;margin:25px auto 16px;color:var(--gold);font-size:1.3rem}
    .rule span:not(:nth-child(2)){width:58px;height:1px;background:var(--gold)}
    .welcome{margin:0;color:#776d68;font-size:1.08rem;letter-spacing:.13em}
    .offer{margin:12px 0 0;color:var(--wine);font-size:clamp(1.25rem,4vw,1.65rem);letter-spacing:.08em}
    @media(max-width:420px){.identity{padding:20px 4px}.logo{margin-bottom:18px}.eyebrow{letter-spacing:.27em}}
  </style>
</body>
</html>
